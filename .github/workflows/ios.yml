
name: ALMASIH iOS Build

on:
  workflow_dispatch:

jobs:
  test-ui:
    name: UI Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Find iPhone Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")), ""))')

          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project ALMASIH.xcodeproj \
            -scheme ALMASIH \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-tests \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALMASIH-UI-Test-Results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  build-simulator:
    name: Build Simulator
    needs: test-ui
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Simulator
        run: |
          xcodebuild \
            -project ALMASIH.xcodeproj \
            -scheme ALMASIH \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Simulator
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build-simulator/Build/Products/Debug-iphonesimulator/ALMASIH.app \
            ALMASIH-iOS-Simulator.zip

      - name: Upload Simulator
        uses: actions/upload-artifact@v4
        with:
          name: ALMASIH-iOS-Simulator
          path: ALMASIH-iOS-Simulator.zip
          retention-days: 7

  build-unsigned-ipa:
    name: Build Unsigned IPA
    needs: test-ui
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iPhone
        run: |
          xcodebuild \
            -project ALMASIH.xcodeproj \
            -scheme ALMASIH \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/ALMASIH.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ALMASIH-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ALMASIH-unsigned-IPA
          path: ALMASIH-unsigned.ipa
          retention-days: 7
