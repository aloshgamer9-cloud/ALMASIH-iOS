
name: ALMASIH iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build ALMASIH
        run: |
          xcodebuild \
            -project ALMASIH.xcodeproj \
            -scheme ALMASIH \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Simulator App
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/ALMASIH.app \
            ALMASIH-iOS-Simulator.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALMASIH-iOS-Simulator
          path: ALMASIH-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
