
name: ALMASIH

options:
  bundleIdPrefix: com.almasih
  deploymentTarget:
    iOS: "16.0"

targets:
  ALMASIH:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: SettingsView.swift
    scheme:
      testTargets:
        - ALMASIHUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.almasih.ios
        PRODUCT_NAME: ALMASIH
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ALMASIH
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  ALMASIHUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ALMASIHUITests
    dependencies:
      - target: ALMASIH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.almasih.ios.uitests
        PRODUCT_NAME: ALMASIHUITests
        TEST_TARGET_NAME: ALMASIH
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
